# Workflow MANUAL de GitHub Actions para compilar el juego 1v1 con Rojo + Lune y subirlo a Roblox.
# IMPORTANTE: Solo se activa manualmente desde la pestaña "Actions" (workflow_dispatch).
# No se ejecuta en pushes ni pull requests.

name: Compilar Mapa y Subir a Roblox

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Tipo de subida en Roblox (Published = público al instante, Saved = borrador)"
        required: true
        default: "Published"
        type: choice
        options:
          - Published
          - Saved
      animations_tag:
        description: "Tag del Release de animaciones a descargar (ej: anim-v1.0.0, o 'latest' para el último)"
        required: false
        default: "latest"
        type: string

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Rojo + Lune + Open Cloud
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga todo el código del repositorio
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      # 2. Descarga las animaciones desde GitHub Release (por Tag o latest) y las compila a Luau
      - name: Descargar y compilar animaciones desde Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANIM_TAG: ${{ github.event.inputs.animations_tag || 'latest' }}
        run: |
          mkdir -p build/animations
          TAG_CLEAN=$(echo "$ANIM_TAG" | tr -d '[:space:]')
          DOWNLOADED=0

          if [ -z "$TAG_CLEAN" ] || [ "$TAG_CLEAN" = "latest" ]; then
            if gh release download --pattern "animations-pack.json" --dir build/animations --clobber 2>/dev/null; then
              DOWNLOADED=1
              echo "Animaciones descargadas del último GitHub Release."
            fi
          else
            if gh release download "$TAG_CLEAN" --pattern "animations-pack.json" --dir build/animations --clobber; then
              DOWNLOADED=1
              echo "Animaciones descargadas del Release $TAG_CLEAN."
            fi
          fi

          if [ "$DOWNLOADED" -eq 0 ]; then
            echo "No se encontró un Release previo; generando animaciones base desde tools/generate_animations.py..."
            python3 tools/generate_animations.py --output build/animations/animations-pack.json
          fi

          python3 tools/compile_animations.py --input build/animations/animations-pack.json --output src/roblox/shared/AnimationClips.luau

      # 3. Instala Rokit y descarga Rojo + Lune según rokit.toml
      - name: Instalar Rokit (Rojo y Lune)
        uses: CompeyDev/setup-rokit@v0.2.1
        with:
          path: .
          token: ${{ github.token }}

      # 4. Compila el proyecto base y todos los scripts Luau en build/game.rbxl
      - name: Compilar scripts con Rojo
        run: |
          mkdir -p build
          rojo build default.project.json --output build/game.rbxl

      # 5. Ejecuta Lune para construir el mapa, arma G18 y KeyframeSequences en build/game.rbxl
      - name: Construir mapa, G18 y animaciones con Lune
        run: |
          lune run tools/build_map.luau
          ls -lh build/game.rbxl

      # 6. Guarda el .rbxl final como artefacto descargable en GitHub (14 días)
      - name: Guardar artefacto .rbxl
        uses: actions/upload-artifact@v4
        with:
          name: ruined-city-1v1-rbxl
          path: build/game.rbxl
          retention-days: 14

      # 7. Publica el archivo .rbxl compilado en Roblox usando Open Cloud API
      - name: Subir a Roblox mediante Open Cloud API
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID || vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_PLACE_ID || vars.ROBLOX_PLACE_ID }}
          VERSION_TYPE: ${{ github.event.inputs.version_type || 'Published' }}
        run: |
          MISSING=""
          [ -z "$ROBLOX_API_KEY" ] && MISSING="$MISSING ROBLOX_API_KEY"
          [ -z "$ROBLOX_UNIVERSE_ID" ] && MISSING="$MISSING ROBLOX_UNIVERSE_ID"
          [ -z "$ROBLOX_PLACE_ID" ] && MISSING="$MISSING ROBLOX_PLACE_ID"

          if [ -n "$MISSING" ]; then
            echo "::error::Faltan estos datos en Repository secrets de GitHub:$MISSING (revisa que estén en 'Repository secrets' con esos nombres exactos)."
            exit 1
          fi

          RESPONSE_FILE=$(mktemp)
          HTTP_CODE=$(curl -sS -o "$RESPONSE_FILE" -w "%{http_code}" \
            --request POST \
            "https://apis.roblox.com/universes/v1/${ROBLOX_UNIVERSE_ID}/places/${ROBLOX_PLACE_ID}/versions?versionType=${VERSION_TYPE}" \
            --header "x-api-key: ${ROBLOX_API_KEY}" \
            --header "Content-Type: application/octet-stream" \
            --data-binary "@build/game.rbxl")

          echo "Respuesta HTTP de Roblox: $HTTP_CODE"
          cat "$RESPONSE_FILE"
          echo ""

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Error al subir el juego a Roblox (HTTP $HTTP_CODE). Revisa tu API Key, permiso universe-places:write y los IDs."
            exit 1
          fi
